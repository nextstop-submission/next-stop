name: publish-apk

# release APK를 빌드해 apk/NextStop_다음집_release.apk 로 같은 브랜치에 커밋한다(익명 작성자).
# 실행: 커밋 메시지에 [publish-apk] 를 넣어 push 하거나, 기본 브랜치에서 수동 실행(workflow_dispatch).
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleRelease --no-daemon --console=plain
      - name: Commit APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/NextStop_다음집_release.apk
          sha256sum apk/NextStop_다음집_release.apk | tee apk/NextStop_다음집_release.apk.sha256
          git config user.name "next-stop-dev"
          git config user.email "dev@next-stop.invalid"
          mkdir -p docs/screens && cp app/build/screens/*.png docs/screens/ 2>/dev/null || true
          git add apk/NextStop_다음집_release.apk apk/NextStop_다음집_release.apk.sha256 docs/screens
          git commit -m "Update release APK and screen snapshots (${GITHUB_SHA::7})" || echo "no change"
          git push
