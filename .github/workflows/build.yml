name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core unit tests (pure Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Pnextstop.coreOnly=true :core:test --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  app:
    name: Android APK (Pleos SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - name: Check android.car stub jar in SDK platform
        run: ls -la "$ANDROID_HOME/platforms/android-35/optional" || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Pleos Maven versions
        run: |
          for a in Vehicle NaviHelper; do
            echo "== $a"; curl -fsS "https://nexus-playground.pleos.ai/repository/maven-releases/ai/pleos/playground/$a/maven-metadata.xml" || echo "metadata unavailable"
          done
      - name: Assemble
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --continue --console=plain 2>&1 | tee build.log
      - name: App unit tests + screen snapshots (Robolectric)
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee -a build.log
          ls -la app/build/screens || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: app/build/screens
      - name: Build errors digest
        if: failure()
        run: |
          echo "---- Kotlin errors ----"; grep -E "^e: " build.log | head -80 || true
          echo "---- Test failures ----"; grep -h -A6 "<failure" app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -40 || true
          echo "---- What went wrong ----"; grep -A12 "What went wrong" build.log | head -80 || true
      - name: Pleos SDK signatures (javap)
        if: success()
        run: |
          for aar in $(find ~/.gradle/caches -name "Vehicle-*.aar" -o -name "NaviHelper-*.aar" | sort -u); do
            d=$(mktemp -d); unzip -q -o "$aar" classes.jar -d "$d"
            echo "#### $(basename $aar)"
            for c in ai.pleos.playground.vehicle.listener.GearSelectionListener ai.pleos.playground.vehicle.listener.DistanceDrivenListener \
                     ai.pleos.playground.vehicle.listener.VehicleListener ai.pleos.playground.vehicle.api.Gear ai.pleos.playground.vehicle.api.Odometer \
                     ai.pleos.playground.navi.data.RouteInfo; do
              javap -cp "$d/classes.jar" -v "$c" 2>/dev/null | grep -E "^  public|Signature: #|RuntimeInvisibleParameterAnnotations|Nullable|NotNull" | grep -vE "^ +[0-9]+: #" | head -60 && echo "-- end $c"
            done
          done
      - name: Lint (report only)
        run: ./gradlew :app:lintDebug --no-daemon || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
